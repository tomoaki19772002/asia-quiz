<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>アジアクイズ 2分チャレンジ</title>
<style>
:root{--bg:#eaf6ff;--ink:#23303b;--card:#fff;--accent:#1f7ae0;--ok:#2fb344;--ng:#e5484d;--land:#cfe6bd;--ctx:#e4e9ee;--line:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;touch-action:manipulation;overscroll-behavior:none;display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
/* start / end */
.center{align-items:center;justify-content:center;text-align:center;gap:14px}
h1{margin:0;font-size:28px;line-height:1.3}
.rules{background:var(--card);border-radius:14px;padding:14px 18px;text-align:left;font-size:15px;line-height:1.8;box-shadow:0 2px 8px #0001}
.rank{background:var(--card);border-radius:14px;padding:10px 16px;min-width:260px;box-shadow:0 2px 8px #0001}
.rank h2{margin:0 0 4px;font-size:16px}
.rank ol{margin:0;padding:0;list-style:none;text-align:left;font-size:17px;font-weight:700}
.rank li{display:flex;gap:8px;padding:2px 0}
.rank li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li.me{color:var(--accent)}
.rank li.none{color:#99a;font-weight:400}
#namebox{display:none;flex-direction:column;gap:8px;align-items:center}
#namebox.on{display:flex}
#namebox input{font:inherit;font-size:20px;padding:8px 12px;border:2px solid var(--accent);border-radius:10px;width:240px;text-align:center}
.big{font-size:64px;font-weight:800;color:var(--accent)}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:20px;font-weight:700;padding:14px 40px;box-shadow:0 3px 0 #14509b}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #14509b}
/* hud */
.hud{display:flex;gap:8px;align-items:stretch}
.box{flex:1;background:var(--card);border-radius:12px;padding:4px 8px;text-align:center;box-shadow:0 2px 6px #0001}
.box small{display:block;font-size:11px;color:#667}
.box b{font-size:26px;font-variant-numeric:tabular-nums}
.box.low b{color:var(--ng)}
#mute{flex:0 0 52px;border:0;border-radius:12px;background:var(--card);font-size:22px;box-shadow:0 2px 6px #0001}
/* map */
#mapwrap{flex:1;min-height:0;margin:6px 0;background:#d6ecff;border-radius:14px;overflow:hidden;position:relative;touch-action:none}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;border:0;border-radius:10px;background:#fffd;font-size:22px;font-weight:700;box-shadow:0 2px 6px #0003}
#zoom button:active{background:#fff}
#map{width:100%;height:100%;display:block}
#map path{fill:var(--land);stroke:var(--line);stroke-width:1.2;stroke-linejoin:round}
#map path.ctx{fill:var(--ctx);stroke:#fff;stroke-width:.8}
#map path.target{fill:#fff3a8;stroke:#e8a400;stroke-width:2}
#map path.glow{animation:glow .7s ease-in-out infinite alternate;stroke:#ff8a00;stroke-width:2.5}
@keyframes glow{from{fill:#fff3a8}to{fill:#ff9d1c}}
/* question */
#qtext{text-align:center;font-size:19px;font-weight:700;min-height:28px;margin-bottom:6px}
#qtext span{color:var(--accent)}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:0;border-radius:14px;background:var(--card);font-size:20px;font-weight:700;min-height:58px;padding:6px;box-shadow:0 3px 0 #b8c6d3}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 #b8c6d3}
.choice.long{font-size:15px;letter-spacing:-.5px}
.choice.flag{padding:6px;display:flex;align-items:center;justify-content:center;min-height:84px}
.choice.flag img{width:100%;max-height:70px;object-fit:contain;border:1px solid #0002;border-radius:4px;pointer-events:none}
.choice.ok{background:var(--ok);color:#fff}
.choice.ng{background:var(--ng);color:#fff}
#fb{text-align:center;font-weight:800;font-size:18px;height:26px;margin-top:6px}
#fb.ok{color:var(--ok)}
#fb.ng{color:var(--ng)}
</style>
</head>
<body>
<div id="app">

  <section id="s-start" class="screen center on">
    <h1>🌏 アジアクイズ<br>2分チャレンジ</h1>
    <div class="rules">
      ① 光った国の名前を4択で当てる<br>
      ② つづけて、その国の国旗を4択で当てる<br>
      ③ さらに、その国の首都を4択で当てる<br>
      ・東アジア / 東南アジア / 南アジア / 中東 / 中央アジア の47か国<br>
      ・正解 <b>+1</b> / まちがい <b>−1</b><br>
      ・制限時間は <b>2分</b>
    </div>
    <div class="rank"><h2>🏆 ハイスコア TOP3</h2><ol id="ranklist0"></ol></div>
    <button class="btn" id="start">スタート</button>
    <small>🔊 音が出ます(マナーモードを確認してね)</small>
  </section>

  <section id="s-game" class="screen">
    <div class="hud">
      <div class="box" id="tbox"><small>のこり時間</small><b id="time">2:00</b></div>
      <div class="box"><small>ポイント</small><b id="score">0</b></div>
      <button id="mute" aria-label="音の切り替え">🔊</button>
    </div>
    <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="zoom"><button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zreset" aria-label="全体表示">⌂</button></div></div>
    <div id="qtext"></div>
    <div id="choices"></div>
    <div id="fb"></div>
  </section>

  <section id="s-end" class="screen center">
    <h1>⏱ タイムアップ!</h1>
    <div>2分間のポイント</div>
    <div class="big" id="final">0</div>
    <div id="detail"></div>
    <div id="namebox"><b>🎉 トップ3入り!名前を入力</b><input id="name" maxlength="8" placeholder="なまえ(8文字まで)" autocomplete="off"><button class="btn" id="save" style="padding:10px 30px;font-size:18px">登録</button></div>
    <div class="rank"><h2>🏆 ハイスコア TOP3</h2><ol id="ranklist"></ol></div>
    <button class="btn" id="retry">もう一度</button>
  </section>

</div>
<script src="map-data.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const GAME_SEC=120, NS='http://www.w3.org/2000/svg';

/* ---------- 音(WebAudio で合成) ---------- */
const Sound=(()=>{
  let ctx,master,muted=false,timer=null,next=0,step=0,drone=[],noiseBuf;
  /* インド風: ラーガ・バイラヴ(Sa r Ga ma Pa dha Ni)+ タンプーラのドローン + ケヘルワ(8拍)のタブラ */
  const SA=60;
  const MEL=[67,0,65,64,65,0,61,60, 60,0,64,65,67,0,68,67, 71,0,72,0,71,68,67,0, 68,67,65,64,61,0,60,0];
  const STEP=0.19;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let last=SA+7;
  function env(t,vol,dur,atk){
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+(atk||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    return g;
  }
  function tone(t,f,dur,type,vol,f2){
    const o=ctx.createOscillator(),g=env(t,vol,dur,0.015);
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
  }
  /* シタール風: 前の音からの「ミーンド」(スライド)+ 倍音 + 共鳴弦 */
  function sitar(t,m){
    const f=hz(m),from=hz(last);last=m;
    const o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=env(t,0.2,STEP*3.2,0.008);
    o.type='sawtooth';
    o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(f,t+0.07);
    lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(700,t+STEP*3);lp.Q.value=4;
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+STEP*3.3);
    tone(t,f*2,STEP*1.8,'sine',0.05);
    tone(t+0.01,f*1.5,STEP*2.4,'sine',0.025);
  }
  function noise(t,dur,vol,freq){
    const s=ctx.createBufferSource();s.buffer=noiseBuf;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=1.2;
    const g=env(t,vol,dur,0.002);
    s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
  }
  /* タブラ: バヤン(低音)とダヤン(高音) */
  const bayan=t=>tone(t,150,0.35,'sine',0.55,70);
  const na=t=>{tone(t,560,0.1,'sine',0.3);noise(t,0.05,0.12,3000)};
  const tin=t=>tone(t,700,0.2,'sine',0.28,640);
  const ge=t=>tone(t,130,0.22,'sine',0.35,80);
  const ka=t=>noise(t,0.05,0.14,1800);
  // ケヘルワ: Dha Ge Na Ti Na Ka Dhi Na
  const TABLA=[t=>{bayan(t);tin(t)},ge,na,ka,na,ka,t=>{bayan(t);tin(t)},na];
  function startDrone(){
    // タンプーラ: Sa(低)・Pa・Sa・Sa' の持続音を少しゆらす
    [[SA-12,0.12],[SA-5,0.07],[SA,0.05],[SA+12,0.025]].forEach(([m,v],k)=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter(),lfo=ctx.createOscillator(),lg=ctx.createGain();
      o.type='sawtooth';o.frequency.value=hz(m);
      lp.type='lowpass';lp.frequency.value=900;
      g.gain.value=v;
      lfo.frequency.value=0.35+k*0.11;lg.gain.value=v*0.6;lfo.connect(lg);lg.connect(g.gain);
      o.connect(lp);lp.connect(g);g.connect(master);
      o.start();lfo.start();drone.push(o,lfo);
    });
  }
  function stopDrone(){drone.forEach(o=>{try{o.stop()}catch(e){}});drone=[]}
  function sched(){
    while(next<ctx.currentTime+0.4){
      const m=MEL[step%MEL.length];
      if(m)sitar(next,m);
      TABLA[step%8](next);
      next+=STEP;step++;
    }
  }
  return{
    init(){
      if(!ctx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return;
        ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:0.5;master.connect(ctx.destination);
        noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.2,ctx.sampleRate);
        const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      }
      if(ctx.state==='suspended')ctx.resume();
    },
    bgm(on){
      if(!ctx)return;
      clearInterval(timer);timer=null;stopDrone();
      if(on){step=0;last=SA+7;next=ctx.currentTime+0.1;startDrone();sched();timer=setInterval(sched,100)}
    },
    ok(){if(!ctx)return;const t=ctx.currentTime;tone(t,880,0.18,'sine',0.5);tone(t+0.11,1318,0.4,'sine',0.5)},
    ng(){if(!ctx)return;const t=ctx.currentTime;tone(t,220,0.35,'sawtooth',0.3,110);tone(t+0.02,164,0.35,'square',0.18,82)},
    setMuted(m){muted=m;if(master)master.gain.value=m?0:0.5},
    get muted(){return muted},
    suspend(s){if(ctx){s?ctx.suspend():ctx.resume()}}
  };
})();

/* ---------- 地図 ---------- */
const svg=$('map');
const BASE=window.ASIA_VIEWBOX.slice(),MAXZ=8;
let vb=BASE.slice();
function applyVB(){svg.setAttribute('viewBox',vb.join(' '))}
function clampVB(){
  vb[2]=Math.min(BASE[2],Math.max(BASE[2]/MAXZ,vb[2]));
  vb[3]=vb[2]*BASE[3]/BASE[2];
  vb[0]=Math.min(BASE[0]+BASE[2]-vb[2],Math.max(BASE[0],vb[0]));
  vb[1]=Math.min(BASE[1]+BASE[3]-vb[3],Math.max(BASE[1],vb[1]));
}
function zoomAt(f,cx,cy){
  const m=svg.getScreenCTM().inverse(),px=m.a*cx+m.e,py=m.d*cy+m.f;
  const w=Math.min(BASE[2],Math.max(BASE[2]/MAXZ,vb[2]/f)),k=w/vb[2];
  vb[0]=px-(px-vb[0])*k;vb[1]=py-(py-vb[1])*k;vb[2]=w;
  clampVB();applyVB();
}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
applyVB();
{
  const wrap=$('mapwrap'),ptrs=new Map();let pinch=0;
  const dist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
  wrap.addEventListener('pointerdown',e=>{
    if(e.target.closest('#zoom'))return;
    wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    pinch=ptrs.size===2?dist():0;
  });
  wrap.addEventListener('pointermove',e=>{
    const o=ptrs.get(e.pointerId);if(!o)return;
    const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
    if(ptrs.size===1){
      const sc=svg.getScreenCTM().a;
      vb[0]-=dx/sc;vb[1]-=dy/sc;clampVB();applyVB();
    }else if(ptrs.size===2){
      const [a,b]=[...ptrs.values()],d=dist();
      if(pinch)zoomAt(d/pinch,(a.x+b.x)/2,(a.y+b.y)/2);
      pinch=d;
    }
  });
  const up=e=>{ptrs.delete(e.pointerId);pinch=0};
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
  wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.25:0.8,e.clientX,e.clientY)},{passive:false});
  $('zin').onclick=()=>zoomCenter(1.6);
  $('zout').onclick=()=>zoomCenter(1/1.6);
  $('zreset').onclick=()=>{vb=BASE.slice();applyVB()};
}
const PREFS=window.COUNTRIES;
{const c=document.createElementNS(NS,'path');c.setAttribute('d',window.CONTEXT_D);c.setAttribute('class','ctx');c.style.pointerEvents='none';svg.appendChild(c)}
const pathEl=PREFS.map(p=>{
  const el=document.createElementNS(NS,'path');
  el.setAttribute('d',p.d);svg.appendChild(el);return el;
});
const overlay=document.createElementNS(NS,'g');svg.appendChild(overlay);

function clearMap(){
  pathEl.forEach(e=>e.removeAttribute('class'));
  overlay.innerHTML='';
}
function halo(p){
  overlay.innerHTML=
   `<circle cx="${p.cx}" cy="${p.cy}" r="6" fill="none" stroke="#ff6a00" stroke-width="3">
      <animate attributeName="r" from="5" to="45" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.9s" repeatCount="indefinite"/></circle>`;
}
function redDot(p){
  overlay.innerHTML=
   `<circle cx="${p.cx}" cy="${p.cy}" r="7" fill="#e5251f" stroke="#fff" stroke-width="2">
      <animate attributeName="opacity" values="1;0.1;1" dur="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="${p.cx}" cy="${p.cy}" r="7" fill="none" stroke="#e5251f" stroke-width="2">
      <animate attributeName="r" from="7" to="32" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.9" to="0" dur="0.7s" repeatCount="indefinite"/></circle>`;
}

/* ---------- ゲーム ---------- */
let score,right,wrong,deadline,tick,bag,cur,phase,locked,ended;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function nextIndex(){
  if(!bag.length)bag=shuffle(PREFS.map((_,i)=>i));
  return bag.pop();
}
function nearby(i,n){
  const p=PREFS[i];
  return PREFS.map((q,j)=>({j,d:Math.hypot(q.cx-p.cx,q.cy-p.cy)}))
    .filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,n).map(o=>o.j);
}
function makeChoices(i){
  const pool=shuffle(nearby(i,9)).slice(0,3);
  return shuffle([i,...pool]);
}
function setScore(){
  $('score').textContent=(score>0?'+':'')+score;
}
function setTime(){
  const left=Math.max(0,deadline-Date.now());
  const s=Math.ceil(left/1000);
  $('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('tbox').classList.toggle('low',s<=10);
  if(left<=0)finish();
}

function askPref(){
  phase='pref';locked=false;
  const i=nextIndex();cur=i;
  clearMap();
  pathEl[i].classList.add('glow');halo(PREFS[i]);
  $('qtext').innerHTML='光っているのは <span>どこの国?</span>';
  $('fb').textContent='';$('fb').className='';
  render(makeChoices(i).map(j=>({label:PREFS[j].name,ok:j===i})),PREFS[i].name);
}
function askFlag(){
  phase='flag';locked=false;
  const i=cur;
  clearMap();
  pathEl[i].classList.add('target');redDot(PREFS[i]);
  $('qtext').innerHTML=`<span>${PREFS[i].name}</span> の国旗は?`;
  $('fb').textContent='';$('fb').className='';
  render(makeChoices(i).map(j=>({flag:PREFS[j].code,ok:j===i})),PREFS[i].name);
}
function askCap(){
  phase='cap';locked=false;
  const i=cur;
  clearMap();
  pathEl[i].classList.add('target');redDot(PREFS[i]);
  $('qtext').innerHTML=`<span>${PREFS[i].name}</span> の首都は?`;
  $('fb').textContent='';$('fb').className='';
  render(makeChoices(i).map(j=>({label:PREFS[j].cap,ok:j===i})),PREFS[i].cap);
}
function render(items,answer){
  const box=$('choices');box.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className='choice';
    if(it.flag){
      b.classList.add('flag');b.setAttribute('aria-label','国旗');
      const im=document.createElement('img');im.src='flags/'+it.flag+'.svg';im.alt='';b.appendChild(im);
    }else{
      b.textContent=it.label;
      if(it.label.length>8)b.classList.add('long');
    }
    b.dataset.ok=it.ok?'1':'';
    b.onclick=()=>answerTap(b,it.ok,answer);
    box.appendChild(b);
  });
}
function answerTap(btn,ok,answer){
  if(locked||ended)return;
  locked=true;
  const fb=$('fb');
  if(ok){
    score++;right++;Sound.ok();
    btn.classList.add('ok');fb.textContent='⭕ せいかい! +1';fb.className='ok';
  }else{
    score--;wrong++;Sound.ng();
    btn.classList.add('ng');
    [...$('choices').children].forEach(c=>{if(c.dataset.ok)c.classList.add('ok')});
    fb.textContent=phase==='flag'?'❌ 正解は緑の国旗 −1':'❌ 正解は「'+answer+'」 −1';fb.className='ng';
  }
  setScore();
  setTimeout(()=>{
    if(ended)return;
    phase==='pref'?askFlag():phase==='flag'?askCap():askPref();
  },ok?650:1700);
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
}
function start(){
  Sound.init();Sound.bgm(true);
  score=right=wrong=0;bag=[];ended=false;
  PREFS.forEach(p=>{new Image().src='flags/'+p.code+'.svg'});
  setScore();
  deadline=Date.now()+GAME_SEC*1000;
  show('s-game');
  setTime();
  clearInterval(tick);tick=setInterval(setTime,100);
  askPref();
}
/* ---------- ハイスコア(この端末のブラウザに保存) ---------- */
const RKEY='asia-quiz-top3';
const Rank={
  load(){try{const a=JSON.parse(localStorage.getItem(RKEY));return Array.isArray(a)?a.slice(0,3):[]}catch(e){return[]}},
  save(a){try{localStorage.setItem(RKEY,JSON.stringify(a))}catch(e){}},
  qualifies(sc){const a=this.load();return sc>0&&(a.length<3||sc>a[a.length-1].score)},
  add(name,sc){const a=this.load();const e={name,score:sc,date:new Date().toLocaleDateString('ja-JP')};a.push(e);a.sort((x,y)=>y.score-x.score);const t=a.slice(0,3);this.save(t);return t.indexOf(e)}
};
function showRank(id,mine){
  const a=Rank.load(),ol=$(id);ol.innerHTML='';
  for(let i=0;i<3;i++){
    const li=document.createElement('li'),e=a[i];
    li.innerHTML=e?`<span>${['🥇','🥈','🥉'][i]}</span><span class="n"></span><span>${e.score>0?'+':''}${e.score}</span>`:`<span>${['🥇','🥈','🥉'][i]}</span><span class="n">---</span>`;
    if(e)li.querySelector('.n').textContent=e.name;else li.className='none';
    if(i===mine)li.classList.add('me');
    ol.appendChild(li);
  }
}
function finish(){
  if(ended)return;
  ended=true;clearInterval(tick);Sound.bgm(false);
  $('final').textContent=(score>0?'+':'')+score;
  $('detail').textContent=`正解 ${right} 問 / まちがい ${wrong} 問`;
  const q=Rank.qualifies(score);
  $('namebox').classList.toggle('on',q);$('retry').style.display=q?'none':'';
  if(q){try{$('name').value=localStorage.getItem('asia-quiz-name')||''}catch(e){}}
  showRank('ranklist',-1);
  show('s-end');
}
function saveName(){
  const name=($('name').value.trim()||'ななし').slice(0,8);
  try{localStorage.setItem('asia-quiz-name',name)}catch(e){}
  const pos=Rank.add(name,score);
  $('namebox').classList.remove('on');$('retry').style.display='';
  showRank('ranklist',pos);showRank('ranklist0',-1);
}

$('start').onclick=start;
$('retry').onclick=start;
$('save').onclick=saveName;
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')saveName()});
showRank('ranklist0',-1);
$('mute').onclick=()=>{
  Sound.setMuted(!Sound.muted);
  $('mute').textContent=Sound.muted?'🔇':'🔊';
};
document.addEventListener('visibilitychange',()=>Sound.suspend(document.hidden));
})();
</script>
</body>
</html>
